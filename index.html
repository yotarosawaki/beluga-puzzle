<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#073452" />
    <title>ベルーガ・マージ</title>
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <div>
          <p class="eyebrow">BELUGA MERGE</p>
          <h1>ベルーガ・マージ</h1>
        </div>
        <div class="score-card" aria-label="現在のスコア">
          <span>SCORE</span><strong id="score">0</strong>
        </div>
      </header>

      <section class="how-to" aria-label="遊び方">
        <span>同じ大きさのベルーガをくっつけて、もっと大きくしよう！</span>
        <button id="restart" type="button">もう一度遊ぶ</button>
      </section>

      <div class="canvas-wrap">
        <canvas id="game" width="390" height="620" aria-label="ベルーガ・マージのゲーム画面"></canvas>
        <div id="gameover" class="gameover" hidden>
          <p>GAME OVER</p>
          <strong id="final-score">0</strong>
          <button id="play-again" type="button">リトライ</button>
        </div>
      </div>
      <p class="hint">マウス・タッチ・← →キーで位置を決め、クリックまたはSpaceで落とします</p>
      <footer>5種類のベルーガを全部つなげられるかな？</footer>
    </main>
    <script src="game.js?v=2"></script>
  </body>
</html>
